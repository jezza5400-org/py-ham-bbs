# ADEVICE takes <capture>,<playback> - using the same named
# device for both here since RX and TX go through the same
# IC-705 USB audio interface.
#
# Confirmed by user:
# ADEVICE plughw:IC705

# AUDIO CONFIGURATION
# Verify host ALSA device GID and device nodes:
#   docker compose run --rm --entrypoint ls direwolf-hamlib -la /dev/snd
#
# ADEVICE <input_output_device>
# cat /proc/asound/cards or aplay -l to find the device.
# ADEVICE null plughw:CD002,DEV=0
# ADEVICE plughw:CARD=Device,DEV=0
# ADEVICE null plughw:CARD=CODEC,DEV=0
# ADEVICE plughw:IC705,IC705
# ADEVICE pipewire
ADEVICE null
# ADEVICE plughw:0,6
# ADEVICE null plughw:2,0
# ADEVICE plughw:CARD=Au,DEV=0

ACHANNELS 1
ARATE 48000
MODEM 1200

# PTT RIG <Hamlib rig number> <device address>
# To find rig number run: 'rigctl -l | grep -i <radio name/id>'
# PTT RIG 3085 127.0.0.1:4532
# PTT RIG 3085 /dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_76bd040255c0ef119e7d6704cce47fdf-if00-port0
# PTT /dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_76bd040255c0ef119e7d6704cce47fdf-if00-port0 RTS
# PTT RIG 3085 /dev/ttyACM0

KISSPORT 8001
AGWPORT 0
FX25TX 1
