services:
  direwolf-hamlib:
    build:
      context: .
      dockerfile: docker/direwolf-hamlib/Dockerfile
      args:
        HAMLIB_VER: "4.7.2"
        DIREWOLF_REF: "1.8.1"
    image: direwolf-hamlib:test
    container_name: direwolf-hamlib
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${DIREWOLF_KISS_PORT:-8001}:8001"
      - "${HAMLIB_PORT:-4532}:4532"
    devices:
      - "/dev/snd:/dev/snd"
      - "${RADIO_DEVICE}:${RADIO_DEVICE}"
    group_add:
      - "${AUDIO_GID:-995}"
      - "${SERIAL_GID:-984}"
    volumes:
      - ./config/direwolf/direwolf.conf:/etc/direwolf/direwolf.conf:ro
    environment:
      RADIO_MODEL: "${RADIO_MODEL:?Set RADIO_MODEL in .env}"
      RADIO_DEVICE: "${RADIO_DEVICE:?Set RADIO_DEVICE in .env}"

  backend-py:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        APP_GID: "${GID:-1000}"
    image: backend-py:test
    container_name: backend-py
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${BACKEND_PORT:-8765}:8765"
    environment:
      PY_HAM_BBS_DB_PATH: /app/data/py_ham_bbs_protocol.db
      PY_HAM_BBS_PORT: 8765
      PY_HAM_BBS_HEALTH_PORT: 8080
      PY_HAM_BBS_DIREWOLF_HOST: direwolf-hamlib
      PY_HAM_BBS_DIREWOLF_PORT: 8001
    volumes:
      - ./.runtime/py_ham_bbs_protocol.db:/app/data/py_ham_bbs_protocol.db:rw
    depends_on:
      direwolf-hamlib:
        condition: service_healthy

  frontend-ts:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: frontend-ts:test
    container_name: frontend-ts
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend-py:
        condition: service_healthy
